services:
  # ─── Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8000
        VITE_DEMO_TOKEN: demo-token
    ports:
      - "3000:80"
    depends_on:
      - gateway

  # ─── API Gateway ───
  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production}
      - REDIS_HOST=redis
      - POSTGRES_SERVER=postgres
      - NLP_SERVICE_URL=http://nlp-service:8001
    volumes:
      - ./gateway/app:/app/app
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp-service:
        condition: service_started

  # ─── Unified NLP Service (llama-cpp-python + Qwen2.5-7B Q4_K_M) ───
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    volumes:
      - ./models:/models:ro
    environment:
      - MODEL_PATH=/models/model.gguf
      - REDIS_URL=redis://redis:6379/1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ─── Data Stores ───
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=aiplatform
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
